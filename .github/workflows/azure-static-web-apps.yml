name: Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-web-app-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build, test, and deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test frontend
        run: npm test
      - name: Publish .NET 10 Functions
        run: dotnet publish api/api.csproj --configuration Release --output artifacts/api
      - name: Deploy frontend and managed API
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          api_location: artifacts/api
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Smoke test deployment
        env:
          APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: npm run test:smoke
